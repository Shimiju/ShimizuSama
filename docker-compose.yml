services:
  postgres:
    image: postgres:16-alpine
    container_name: shimizu-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shimizu
    ports:
      - "5432:5432"
    volumes:
      - shimizu-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shimizu"]
      interval: 5s
      timeout: 5s
      retries: 10

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: shimizu-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./lavalink/yt-dlp:/opt/yt-dlp
      - ./lavalink/node:/opt/node
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shimizu-pg-data:
